Reports <code>$name</code> references without a <code>:local</code>/<code>:global</code> declaration in scope, and globals declared in another script but not in this one (a script must declare <code>:global x</code> before using it). Variables provided by hook scripts (DHCP, PPP, netwatch) and function parameters are not reported.
