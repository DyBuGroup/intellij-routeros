pluginGroup = dev.dybug.routeros
pluginName = RouterOS Script
pluginRepositoryUrl = https://github.com/dybug/routeros-intellij
pluginVersion = 1.0.0

# sinceBuild 251 = IntelliJ Platform 2025.1; no untilBuild
pluginSinceBuild = 251
platformVersion = 2025.1.7

# Local IDE used by runPyCharmLocal
localPyCharmPath = /opt/jetbrains/pycharm

# Publishing token placeholder (real value comes from the environment / CI secrets)
intellijPlatformPublishingToken =

kotlin.stdlib.default.dependency = false
kotlin.daemon.jvmargs = -Xmx1g -XX:+UseSerialGC

org.gradle.configuration-cache = true
org.gradle.caching = false
# Keep the build light on this machine
org.gradle.jvmargs = -Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max = 2
org.gradle.parallel = false
org.gradle.daemon.idletimeout = 600000
kotlin.incremental = false
