version: 2
# Monthly, one grouped pull request per ecosystem, to keep Actions minutes low
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v6 makes the caching component closed source under Gradle's Terms of Use; stay on v5
      - dependency-name: gradle/actions*
        update-types: ["version-update:semver-major"]
