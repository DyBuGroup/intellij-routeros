name: Update RouterOS schemas

# Monthly: ask MikroTik for the current stable, long-term and development releases, regenerate the
# bundled schemas from the manual and open a pull request when anything changed.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-schemas
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Regenerate schemas for all release channels
        run: ./gradlew :tools:schema-extractor:run --args="--channels --refresh"

      - name: Test with the new schemas
        run: ./gradlew check

      # only schema changes count: reports also describe the difference to the previous run
      - name: Collect changes
        id: changes
        run: |
          if git diff --quiet -- src/main/resources/schema \
             && [ -z "$(git ls-files --others --exclude-standard -- src/main/resources/schema)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mkdir -p out
            tar -czf out/schemas.tgz src/main/resources/schema tools/schema-extractor/reports
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: schemas
          path: out/schemas.tgz
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

  # Runs no build code; it only commits the generated files and opens the pull request.
  pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schemas
          path: ${{ runner.temp }}/artifact
      # The archive comes from the job that ran build code: unpack it outside the checkout, accept
      # only plain files in the two expected directories, then replace those directories.
      - name: Unpack the generated files
        run: |
          staging="$RUNNER_TEMP/schemas"
          mkdir "$staging"
          tar -xzf "$RUNNER_TEMP/artifact/schemas.tgz" -C "$staging" --no-same-owner --no-same-permissions
          if find "$staging" -mindepth 1 ! -type f ! -type d | grep -q .; then
            echo "unexpected links or special files in the archive"; exit 1
          fi
          if find "$staging" -type f | sed "s|^$staging/||" \
               | grep -vE '^(src/main/resources/schema|tools/schema-extractor/reports)/[A-Za-z0-9._-]+$' | grep -q .; then
            echo "unexpected paths in the archive"; exit 1
          fi
          for dir in src/main/resources/schema tools/schema-extractor/reports; do
            rm -rf "$dir"
            mkdir -p "$dir"
            cp "$staging/$dir"/* "$dir"/
          done

      # PRs opened with GITHUB_TOKEN do not trigger other workflows; the generate job already ran
      # `./gradlew check` with the new schemas.
      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          branch="schema/update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A src/main/resources/schema tools/schema-extractor/reports
          git -c core.hooksPath=/dev/null commit -m "chore(schema): update bundled RouterOS schemas"
          git push --force origin "$branch"
          {
            echo "Bundled schemas regenerated from the RouterOS manual for the current release channels:"
            echo
            jq -r '.channels | to_entries[] | "- \(.key): RouterOS \(.value.release) (docs \(.value.version))"' src/main/resources/schema/index.json
            echo
            echo "See tools/schema-extractor/reports for counts and differences."
          } > "$RUNNER_TEMP/pr-body.md"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE" --head "$branch" \
              --title "chore(schema): update bundled RouterOS schemas" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
