name: Release

# Either push a tag vX.Y.Z[-suffix] matching pluginVersion, or run this workflow manually on main:
# it then builds main and creates the tag v<pluginVersion> once the release has been published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # manual runs only from main, never from an unreviewed branch
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # the exact commit that triggered the run (github.sha), never a branch of the same name
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Determine and check the tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          tag="v$version"
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' || { echo "unexpected version $version"; exit 1; }
          if [ "$EVENT" = "push" ]; then
            test "$REF_NAME" = "$tag" || { echo "tag $REF_NAME does not match pluginVersion $version"; exit 1; }
          elif gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists; bump pluginVersion first"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test, verify and build
        run: ./gradlew check verifyPlugin buildPlugin

      # skipped by Gradle when the signing secrets are not set
      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin

      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./gradlew -q getChangelog --no-header --project-version="${TAG#v}" > release-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            build/distributions/*.zip
            release-notes.md

      # last, so that a failure above never leaves a published version without its release
      - name: Publish to JetBrains Marketplace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

  # only this job can write to the repository, and it runs no build code; for manual runs it also
  # creates the tag, on the commit that was built
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # the signed zip when signing was configured, otherwise the plain one
          zip=$(ls build/distributions/*-signed.zip 2>/dev/null || ls build/distributions/*.zip)
          gh release create "$TAG" $zip --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md $prerelease
